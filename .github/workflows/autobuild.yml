name: Auto-Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create draft GitHub release with changelog'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'r*'

permissions:
  contents: write

env:
  QT_VERSION: '6.8.2'
  ENABLE_SIGNING: 'true'

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -E 'project\(KoordASIO VERSION' CMakeLists.txt | head -1 | sed -E 's/.*VERSION ([0-9.]+).*/\1/' | tr -d '\r')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read VERSION from CMakeLists.txt"
            exit 1
          fi
          TAG="r$(echo "$VERSION" | tr '.' '_')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "artifact=KoordASIO_${VERSION}.exe" >> "$GITHUB_OUTPUT"
          echo "Building KoordASIO $VERSION (tag $TAG)"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          tools: tools_ninja tools_cmake
          aqtversion: '==3.3.*'
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Download ASIO SDK
        shell: pwsh
        run: |
          $dest = "$env:GITHUB_WORKSPACE\windows\ASIOSDK2"
          if (Test-Path $dest) { return }
          $zip = "$env:TEMP\asiosdk.zip"
          Invoke-WebRequest -Uri "https://download.steinberg.net/sdk_downloads/asiosdk_2.3.3_2019-06-14.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:TEMP -Force
          Move-Item -Path "$env:TEMP\asiosdk_2.3.3_2019-06-14" -Destination $dest -Force

      - name: Build
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $qt = $env:QT_ROOT_DIR

          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$root\build", "$root\deploy", "$root\Output"
          New-Item -ItemType Directory -Force -Path "$root\build\release\kdasioconfig", "$root\deploy\x86_64" | Out-Null

          cmake -DCMAKE_PREFIX_PATH="$qt" -DCMAKE_BUILD_TYPE=Release `
            -S "$root\src\kdasioconfig" -B "$root\build\release\kdasioconfig" -G "NMake Makefiles"
          Push-Location "$root\build\release\kdasioconfig"
          nmake
          Pop-Location

          cmake -S "$root\src" -B "$root\build\release\flexasio" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$root\build\release\flexasio"

          $deploy = "$root\deploy\x86_64"
          Push-Location "$root\build\release\flexasio"
          & "$qt\bin\windeployqt.exe" --release --no-compiler-runtime --dir $deploy `
            --qmldir "$root\src\kdasioconfig" `
            --no-system-d3d-compiler --no-opengl-sw "$root\build\release\kdasioconfig\KoordASIOControl.exe"
          Pop-Location

          if ($env:VCToolsRedistDir) {
            $crt = Get-ChildItem (Join-Path $env:VCToolsRedistDir 'x64') -Directory |
              Where-Object { $_.Name -like 'Microsoft.VC*.CRT' } |
              Sort-Object Name -Descending | Select-Object -First 1
            if ($crt) { Copy-Item (Join-Path $crt.FullName '*.dll') -Destination $deploy -Force }
          }

          $bin = "$root\build\release\flexasio\install\bin"
          Move-Item "$root\build\release\kdasioconfig\KoordASIOControl.exe" $deploy -Force
          foreach ($f in @('KoordASIO.dll','portaudio.dll','ASIOTest.dll','sndfile.dll','FlexASIOTest.exe','PortAudioDevices.exe')) {
            Move-Item (Join-Path $bin $f) $deploy -Force
          }

          Copy-Item "$root\windows\kdinstaller.iss" "$root\kdinstaller.iss" -Force

      - name: Build 32-bit driver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $deploy = "$root\deploy\x86"
          New-Item -ItemType Directory -Force -Path $deploy | Out-Null

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          if (-not $vs) { throw 'no Visual Studio installation found' }
          $vcvarsall = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'

          # The x86 toolchain is confined to this one cmd invocation: the job's
          # environment is set up for x64 and Qt/windeployqt still need it.
          $build = "$root\build\release\flexasio-x86"
          cmd /c "`"$vcvarsall`" x86 && cmake -S `"$root\src`" -B `"$build`" -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build `"$build`""
          if ($LASTEXITCODE -ne 0) { throw "32-bit build failed ($LASTEXITCODE)" }

          $bin = "$build\install\bin"
          foreach ($f in @('KoordASIO.dll','portaudio.dll','ASIOTest.dll','sndfile.dll','FlexASIOTest.exe','PortAudioDevices.exe')) {
            Move-Item (Join-Path $bin $f) $deploy -Force
          }

          if ($env:VCToolsRedistDir) {
            $crt = Get-ChildItem (Join-Path $env:VCToolsRedistDir 'x86') -Directory |
              Where-Object { $_.Name -like 'Microsoft.VC*.CRT' } |
              Sort-Object Name -Descending | Select-Object -First 1
            if ($crt) { Copy-Item (Join-Path $crt.FullName '*.dll') -Destination $deploy -Force }
          }

          # Prove it really is 32-bit before it goes anywhere near an installer.
          $bytes = [System.IO.File]::ReadAllBytes("$deploy\KoordASIO.dll")
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machineType = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machineType -ne 0x014C) {
            throw ("KoordASIO.dll is not i386 (machine 0x{0:X4})" -f $machineType)
          }
          Write-Host 'x86 KoordASIO.dll confirmed i386'

      - name: Install dotnet sign tool
        if: env.ENABLE_SIGNING == 'true'
        shell: pwsh
        run: dotnet tool install --global --prerelease sign

      - name: Sign deployed binaries (Azure Trusted Signing)
        if: env.ENABLE_SIGNING == 'true'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $deploy = "$env:GITHUB_WORKSPACE\deploy"
          foreach ($file in @('x86_64\KoordASIO.dll', 'x86_64\KoordASIOControl.exe', 'x86\KoordASIO.dll')) {
            sign code artifact-signing `
              --artifact-signing-endpoint "https://weu.codesigning.azure.net" `
              --artifact-signing-account "kormix-signing" `
              --artifact-signing-certificate-profile "KormixProdSigningProfile" `
              "$deploy\$file"
          }

      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ISCC.exe "$env:GITHUB_WORKSPACE\kdinstaller.iss" "/FKoordASIO-$env:VERSION" "/DApplicationVersion=$env:VERSION"

      - name: Sign installer (Azure Trusted Signing)
        if: env.ENABLE_SIGNING == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          sign code artifact-signing `
            --artifact-signing-endpoint "https://weu.codesigning.azure.net" `
            --artifact-signing-account "kormix-signing" `
            --artifact-signing-certificate-profile "KormixProdSigningProfile" `
            "$env:GITHUB_WORKSPACE\Output\KoordASIO-$env:VERSION.exe"

      - name: Stage artifact
        shell: pwsh
        run: |
          $src = "$env:GITHUB_WORKSPACE\Output\KoordASIO-${{ steps.version.outputs.version }}.exe"
          $dst = "$env:GITHUB_WORKSPACE\deploy\${{ steps.version.outputs.artifact }}"
          Move-Item $src $dst -Force
          # Second copy under a version-independent name so
          # /releases/latest/download/KoordASIO-Setup.exe is a permanent link.
          Copy-Item $dst "$env:GITHUB_WORKSPACE\deploy\KoordASIO-Setup.exe" -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: deploy/${{ steps.version.outputs.artifact }}
          if-no-files-found: error

      - name: Generate release notes
        if: >-
          startsWith(github.ref, 'refs/tags/r') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        shell: bash
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A hand-written summary beats a commit dump for anyone reading the
          # release page, so prefer one when this version has it.
          if [ -f "release-notes/${VERSION}.md" ]; then
            cp "release-notes/${VERSION}.md" release_notes.md
            echo "Using curated release-notes/${VERSION}.md"
            exit 0
          fi

          PREV_TAG=""
          while IFS= read -r tag; do
            if [ "$tag" != "$VERSION_TAG" ]; then
              PREV_TAG="$tag"
              break
            fi
          done < <(git tag -l 'r*' --sort=-v:refname)

          {
            echo "## KoordASIO ${{ steps.version.outputs.version }}"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "Changes since **${PREV_TAG}**:"
              echo ""
              git log "${PREV_TAG}..HEAD" --pretty=format:'- %s (`%h`)' --no-merges
            else
              echo "Changes:"
              echo ""
              git log -30 --pretty=format:'- %s (`%h`)' --no-merges
            fi
          } > release_notes.md

      - name: Publish draft release
        if: >-
          startsWith(github.ref, 'refs/tags/r') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }} (${{ steps.version.outputs.tag }})
          body_path: release_notes.md
          draft: true
          prerelease: false
          make_latest: false
          files: |
            deploy/${{ steps.version.outputs.artifact }}
            deploy/KoordASIO-Setup.exe

      # action-gh-release only writes the body when it creates the release, so a
      # re-run against an existing draft keeps the changelog of the first build.
      - name: Sync release notes
        if: >-
          startsWith(github.ref, 'refs/tags/r') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ steps.version.outputs.tag }}" --notes-file release_notes.md
