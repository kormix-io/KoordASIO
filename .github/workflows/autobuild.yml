name: Auto-Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'r*'
    branches:
      - v2
  pull_request:
    branches:
      - v2

permissions:
  contents: write

env:
  QT_VERSION: '6.8.2'

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -E '^\s*VERSION\s*=' kdASIOVersion.txt | head -1 | sed -E 's/^[^=]*=\s*//' | tr -d '\r')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read VERSION from kdASIOVersion.txt"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact=KoordASIO_${VERSION}.exe" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" =~ ^refs/tags/r[0-9]+_[0-9]+_[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Building KoordASIO $VERSION"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          tools: tools_ninja tools_cmake
          aqtversion: '==3.3.*'
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Download ASIO SDK
        shell: pwsh
        run: |
          $dest = "$env:GITHUB_WORKSPACE\windows\ASIOSDK2"
          if (Test-Path $dest) { return }
          $zip = "$env:TEMP\asiosdk.zip"
          Invoke-WebRequest -Uri "https://download.steinberg.net/sdk_downloads/asiosdk_2.3.3_2019-06-14.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:TEMP -Force
          Move-Item -Path "$env:TEMP\asiosdk_2.3.3_2019-06-14" -Destination $dest -Force

      - name: Build
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $qt = $env:QT_ROOT_DIR

          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$root\build", "$root\deploy", "$root\Output"
          New-Item -ItemType Directory -Force -Path "$root\build\release\kdasioconfig", "$root\deploy\x86_64" | Out-Null

          cmake -DCMAKE_PREFIX_PATH="$qt" -DCMAKE_BUILD_TYPE=Release `
            -S "$root\src\kdasioconfig" -B "$root\build\release\kdasioconfig" -G "NMake Makefiles"
          Push-Location "$root\build\release\kdasioconfig"
          nmake
          Pop-Location

          cmake -S "$root\src" -B "$root\build\release\flexasio" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$root\build\release\flexasio"

          $deploy = "$root\deploy\x86_64"
          Push-Location "$root\build\release\flexasio"
          & "$qt\bin\windeployqt.exe" --release --no-compiler-runtime --dir $deploy `
            --no-system-d3d-compiler --no-opengl-sw "$root\build\release\kdasioconfig\KoordASIOControl.exe"
          Pop-Location

          if ($env:VCToolsRedistDir) {
            $crt = Get-ChildItem (Join-Path $env:VCToolsRedistDir 'x64') -Directory |
              Where-Object { $_.Name -like 'Microsoft.VC*.CRT' } |
              Sort-Object Name -Descending | Select-Object -First 1
            if ($crt) { Copy-Item (Join-Path $crt.FullName '*.dll') -Destination $deploy -Force }
          }

          $bin = "$root\build\release\flexasio\install\bin"
          Move-Item "$root\build\release\kdasioconfig\KoordASIOControl.exe" $deploy -Force
          foreach ($f in @('KoordASIO.dll','portaudio.dll','ASIOTest.dll','sndfile.dll','FlexASIOTest.exe','PortAudioDevices.exe')) {
            Move-Item (Join-Path $bin $f) $deploy -Force
          }

          Copy-Item "$root\windows\kdinstaller.iss" "$root\kdinstaller.iss" -Force
          ISCC.exe "$root\kdinstaller.iss" "/FKoordASIO-$env:VERSION" "/DApplicationVersion=$env:VERSION"

      - name: Sign installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          WINDOWS_CODESIGN_CERT: ${{ secrets.WINDOWS_CODESIGN_CERT }}
          WINDOWS_CODESIGN_PWD: ${{ secrets.WINDOWS_CODESIGN_PWD }}
        run: |
          if (-not $env:WINDOWS_CODESIGN_CERT) {
            Write-Output 'WINDOWS_CODESIGN_CERT not set; skipping code signing'
            exit 0
          }
          [IO.File]::WriteAllBytes('C:\KoordOVCert.pfx', [Convert]::FromBase64String($env:WINDOWS_CODESIGN_CERT))
          Set-Content -Path 'C:\KoordOVCertPwd' -Value $env:WINDOWS_CODESIGN_PWD -NoNewline
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f C:\KoordOVCert.pfx /p (Get-Content C:\KoordOVCertPwd -Raw) `
            /fd SHA256 /td SHA256 /tr http://timestamp.sectigo.com `
            "$env:GITHUB_WORKSPACE\Output\KoordASIO-$env:VERSION.exe"

      - name: Stage artifact
        shell: pwsh
        run: |
          $src = "$env:GITHUB_WORKSPACE\Output\KoordASIO-${{ steps.version.outputs.version }}.exe"
          $dst = "$env:GITHUB_WORKSPACE\deploy\${{ steps.version.outputs.artifact }}"
          Move-Item $src $dst -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: deploy/${{ steps.version.outputs.artifact }}
          if-no-files-found: error

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/r')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.version }} (${{ github.ref_name }})
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          draft: true
          files: deploy/${{ steps.version.outputs.artifact }}
