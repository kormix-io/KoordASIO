name: Auto-Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'r*'
    branches:
      - v2
      - 'autobuild*'
  pull_request:
    branches:
      - v2

jobs:
  prepare:
    name: Prepare build
    runs-on: ubuntu-latest
    outputs:
      publish_to_release: ${{ steps.version.outputs.PUBLISH_TO_RELEASE }}
      version: ${{ steps.version.outputs.KOORDASIO_VERSION }}
      build_version: ${{ steps.version.outputs.BUILD_VERSION }}
      release_tag: ${{ steps.version.outputs.RELEASE_TAG }}
      release_title: ${{ steps.version.outputs.RELEASE_TITLE }}
      is_prerelease: ${{ steps.version.outputs.IS_PRERELEASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and release metadata
        id: version
        shell: pwsh
        run: ./.github/autobuild/version.ps1

  build_windows:
    name: Build Windows installer
    needs: prepare
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Qt and Chocolatey packages
        uses: actions/cache@v4
        with:
          path: |
            C:\Qt
            C:\ChocoCache
          key: koordasio-qt-${{ runner.os }}-${{ hashFiles('.github/autobuild/build.ps1', 'kdASIOVersion.txt') }}
          restore-keys: |
            koordasio-qt-${{ runner.os }}-

      - name: Setup toolchain
        shell: pwsh
        run: ./.github/autobuild/build.ps1 -Stage setup

      - name: Build and sign installer
        shell: pwsh
        env:
          koordasio_buildversionstring: ${{ needs.prepare.outputs.version }}
          WINDOWS_CODESIGN_CERT: ${{ secrets.WINDOWS_CODESIGN_CERT }}
          WINDOWS_CODESIGN_PWD: ${{ secrets.WINDOWS_CODESIGN_PWD }}
        run: ./.github/autobuild/build.ps1 -Stage build

      - name: Collect artifact name
        id: artifacts
        shell: pwsh
        env:
          koordasio_buildversionstring: ${{ needs.prepare.outputs.version }}
        run: ./.github/autobuild/build.ps1 -Stage get-artifacts

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts.outputs.artifact_1 }}
          path: deploy/${{ steps.artifacts.outputs.artifact_1 }}
          if-no-files-found: error

      - name: Create draft release
        if: needs.prepare.outputs.publish_to_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_title }}
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          draft: true
          files: deploy/${{ steps.artifacts.outputs.artifact_1 }}
